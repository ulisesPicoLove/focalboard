version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    paths:
      - services/store/sqlstore/migrations

# goconst and err113 are off: the SQL builders repeat column and type names by nature, and the
# configuration and validation errors carry their own text and are never compared.
linters:
  default: none
  enable:
    - ineffassign
    - unparam
    - errcheck
    - govet
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - gosec
    - makezero
    - staticcheck
    - prealloc
    - asciicheck
    - dogsled
    - dupl
    - gocritic
    - godot
    - goheader
    - revive
    - nakedret
    - gomodguard_v2
    - goprintffuncname
    - lll
    - misspell
    - nolintlint
    - unconvert
    - unused
    - whitespace
    - gocyclo
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 180
    dupl:
      threshold: 200
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    # what golangci-lint v1 excluded by default
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # tests repeat literals, build errors on the spot, ignore values of helpers and use
      # throwaway credentials and cookies
      - path: (_test\.go|services/store/storetests/)
        linters:
          - dogsled
          - prealloc
          - gosec
          - unparam
    paths:
      - services/store/sqlstore/migrations
