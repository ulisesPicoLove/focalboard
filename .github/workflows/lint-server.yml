name: golangci-lint

on:
  push:
    branches: [ main, release-** ]
  pull_request:
    branches: [ main, release-** ]
  workflow_dispatch:

env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  down-migrations:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: "focalboard"
      - name: assert that down migrations are SELECT 1 scripts
        run: |
          cd focalboard
          echo 'SELECT 1;' > downmigration
          for file in server/services/store/sqlstore/migrations/*.down.sql; do diff -Bw downmigration $file; done

  golangci:
    name: plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: "focalboard"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: focalboard/server/go.mod
      # Not the project's install.sh: it picks the checksum of the .sbom.json file, which has the
      # same name plus a suffix, and the verification of a good download fails.
      - name: set up golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
        run: |
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" "${base}/${archive}"
          want=$(curl -sSfL "${base}/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" | grep " ${archive}\$" | awk '{print $1}')
          test -n "${want}"
          echo "${want}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 0755 "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"
          golangci-lint --version
      - name: lint
        run: |
          cd focalboard
          make server-lint
